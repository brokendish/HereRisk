# HereRisk services in containers (Phase 3-G). Same file on Mac and on a Linux VPS.
#
#   docker compose up -d --build              # location-api + elevation-api
#   docker compose --profile admin up -d      # + data-inventory (management page)
#   docker compose --profile init run --rm token          # once: Bearer token file
#   docker compose --profile init run --rm elevation-init # once: fixture elevation data
#   docker compose --profile init run --rm flood-index    # once (and after a flood registration change)
#   docker compose --profile verify run --rm flood-verify  # check the flood index against the source
#   docker compose --profile verify run --rm flood-local-analysis  # Phase 4-C PoC (diagnosis only)
#   docker compose --profile init run --rm flood-diag-build   # Phase 4-D: prepare invalid polygons (offline)
#   docker compose --profile verify run --rm flood-diag [point|compare|bench|cases ...]  # diagnosis only
#   docker compose --profile shadow up -d location-api-shadow   # Phase 4-E: Location API + Shadow (127.0.0.1:8011)
#   docker compose --profile verify run --rm flood-shadow-verify  # Phase 4-E automated Shadow checks
#   docker compose --profile diagnostic-api up -d location-api-diagnostic  # Phase 4-G: + diagnostic API (127.0.0.1:8012)
#   docker compose --profile verify run --rm flood-diag-api-verify  # Phase 4-G automated diagnostic API checks
#   docker compose --profile init run --rm tsunami-index   # Phase 4-M: A40 index (regions file with tsunami_sources)
#   docker compose --profile verify run --rm tsunami-verify  # Phase 4-M: independent check against the A40 GML
#   docker compose --profile tsunami up -d location-api-tsunami  # Phase 4-M: + tsunami, local only (127.0.0.1:8013)
#   (HERERISK_TSUNAMI_REGIONS: the regions file holding tsunami_sources, default regions-tsunami.json)
#
# Host exposure is 127.0.0.1 only. Official data, the regions file and the token stay outside Git
# and outside the image; they are mounted read only. See README "Docker Compose".
#   HERERISK_DATA_DIR    address data + regions.json (default ~/hererisk-data)  -> /data (ro)
#   HERERISK_SECRET_DIR  directory holding api-token (default ~/.hererisk-local/secrets)
# The flood search index (built from the registered A31a ZIPs, local verification only) lives in the
# volume hererisk-flood-index; the Location API reads it read only.
name: hererisk

x-hardening: &hardening
  image: hererisk-app:local
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 64
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  elevation-api:
    <<: *hardening
    build:
      context: .
      dockerfile: deploy/app/Dockerfile
    restart: unless-stopped
    mem_limit: 256m
    command: ["python", "-m", "hererisk.elevation.api.server",
              "--data-root", "/var/lib/hererisk/fixture", "--host", "0.0.0.0", "--port", "8000",
              "--fixture-demo", "--container", "--auth-token-file", "/run/secrets/api_token"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - elevation-data:/var/lib/hererisk:ro
    secrets:
      - api_token
    networks:
      - public
    healthcheck:   # the real endpoint: POST /api/v1/elevation (fixture coverage point) -> 200
      test: ["CMD", "python", "-c", "import http.client,json;t=open('/run/secrets/api_token').readline().strip();c=http.client.HTTPConnection('127.0.0.1',8000,timeout=3);c.request('POST','/api/v1/elevation',json.dumps({'lat':35.701882,'lon':139.713178}),{'Content-Type':'application/json','Authorization':'Bearer '+t});exit(0 if c.getresponse().status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  location-api:
    <<: *hardening
    restart: unless-stopped
    mem_limit: 1g
    command: ["python", "-m", "hererisk.location.server", "--host", "0.0.0.0", "--port", "8001", "--container",
              "--address-regions", "/data/regions.json",
              "--elevation-api", "http://elevation-api:8000", "--elevation-token-file", "/run/secrets/api_token",
              "--elevation-fixture", "--flood-index", "/var/lib/hererisk-flood/flood-index.sqlite"]
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ${HERERISK_DATA_DIR:-${HOME}/hererisk-data}:/data:ro
      - flood-index:/var/lib/hererisk-flood:ro
    secrets:
      - api_token
    networks:
      - public
    depends_on:
      elevation-api:
        condition: service_healthy
    healthcheck:   # the real endpoint: GET /api/v1/location -> 200
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8001/api/v1/location?lat=35.681236&lon=139.767125',timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  location-api-shadow:   # Phase 4-E acceptance only: the same API with the flood diagnosis in Shadow
    <<: *hardening
    profiles: ["shadow"]
    restart: "no"
    mem_limit: 1g
    command: ["python", "-m", "hererisk.location.server", "--host", "0.0.0.0", "--port", "8001", "--container",
              "--address-regions", "/data/regions.json",
              "--elevation-api", "http://elevation-api:8000", "--elevation-token-file", "/run/secrets/api_token",
              "--elevation-fixture", "--flood-index", "/var/lib/hererisk-flood/flood-index.sqlite",
              "--flood-settings", "/etc/hererisk/flood-settings.json",
              "--flood-diag-index", "/var/lib/hererisk-flood-diag/flood-diag.sqlite"]
    ports:
      - "127.0.0.1:8011:8001"
    volumes:
      - ${HERERISK_DATA_DIR:-${HOME}/hererisk-data}:/data:ro
      - flood-index:/var/lib/hererisk-flood:ro
      - flood-diag:/var/lib/hererisk-flood-diag:ro
      - ./deploy/flood/flood-settings.shadow.json:/etc/hererisk/flood-settings.json:ro
    secrets:
      - api_token
    networks:
      - public
    depends_on:
      elevation-api:
        condition: service_healthy
    healthcheck:   # the real endpoint: GET /api/v1/location -> 200
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8001/api/v1/location?lat=35.681236&lon=139.767125',timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  location-api-diagnostic:   # Phase 4-G acceptance only: the same API + GET /api/v1/diagnostics/flood (not for publication)
    <<: *hardening
    profiles: ["diagnostic-api"]
    restart: "no"
    mem_limit: 1g
    command: ["python", "-m", "hererisk.location.server", "--host", "0.0.0.0", "--port", "8001", "--container",
              "--address-regions", "/data/regions.json",
              "--elevation-api", "http://elevation-api:8000", "--elevation-token-file", "/run/secrets/api_token",
              "--elevation-fixture", "--flood-index", "/var/lib/hererisk-flood/flood-index.sqlite",
              "--flood-settings", "/etc/hererisk/flood-settings.json",
              "--flood-diag-index", "/var/lib/hererisk-flood-diag/flood-diag.sqlite"]
    ports:
      - "127.0.0.1:8012:8001"
    volumes:
      - ${HERERISK_DATA_DIR:-${HOME}/hererisk-data}:/data:ro
      - flood-index:/var/lib/hererisk-flood:ro
      - flood-diag:/var/lib/hererisk-flood-diag:ro
      - ./deploy/flood/flood-settings.diagnostic-api.json:/etc/hererisk/flood-settings.json:ro
    secrets:
      - api_token
    networks:
      - public
    depends_on:
      elevation-api:
        condition: service_healthy
    healthcheck:   # the real endpoint: GET /api/v1/location -> 200
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8001/api/v1/location?lat=35.681236&lon=139.767125',timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  # Management page: only with --profile admin, own network (no route to / from the public APIs),
  # host 127.0.0.1 only. Never give it a public port; on a VPS reach it through an SSH tunnel.
  data-inventory:
    <<: *hardening
    profiles: ["admin"]
    restart: unless-stopped
    mem_limit: 256m
    command: ["python", "-m", "hererisk.data_inventory", "--regions", "/data/regions.json",
              "--serve", "--container", "--port", "8090"]
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ${HERERISK_DATA_DIR:-${HOME}/hererisk-data}:/data:ro
    networks:
      - admin
    healthcheck:   # the real endpoint: GET /inventory.json -> 200
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8090/inventory.json',timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # One-time setup (--profile init), no network at all.
  elevation-init:   # publishes the fixture into the elevation-data volume; never deletes
    <<: *hardening
    profiles: ["init"]
    network_mode: none
    restart: "no"
    mem_limit: 256m
    command: ["/bin/sh", "/app/bin/init-fixture.sh"]
    volumes:
      - elevation-data:/var/lib/hererisk

  flood-index:   # builds the flood search index from the registered ZIPs (read only) into its volume
    <<: *hardening
    profiles: ["init"]
    network_mode: none
    restart: "no"
    mem_limit: 1g
    command: ["python", "-m", "hererisk.flood", "build", "--regions", "/data/regions.json",
              "--output", "/var/lib/hererisk-flood/flood-index.sqlite"]
    volumes:
      - ${HERERISK_DATA_DIR:-${HOME}/hererisk-data}:/data:ro
      - flood-index:/var/lib/hererisk-flood

  flood-verify:   # one-shot check of the flood index / provider against the official ZIPs (read only)
    <<: *hardening
    profiles: ["verify"]
    network_mode: none
    restart: "no"
    mem_limit: 4g
    command: ["python", "-m", "hererisk.flood", "verify", "--regions", "/data/regions.json",
              "--index", "/var/lib/hererisk-flood/flood-index.sqlite", "--report-dir", "/reports"]
    volumes:
      - ${HERERISK_DATA_DIR:-${HOME}/hererisk-data}:/data:ro
      - flood-index:/var/lib/hererisk-flood:ro
      - ${HERERISK_REPORT_DIR:-${HOME}/.hererisk-local/reports}:/reports

  flood-local-analysis:   # one-shot Phase 4-C PoC: local analysis of invalid polygons (diagnosis only)
    <<: *hardening
    profiles: ["verify"]
    network_mode: none
    restart: "no"
    mem_limit: 4g
    command: ["python", "-m", "hererisk.flood", "local-analysis", "--regions", "/data/regions.json",
              "--index", "/var/lib/hererisk-flood/flood-index.sqlite", "--report-dir", "/reports",
              "--point", "35.625065,139.573836"]
    volumes:
      - ${HERERISK_DATA_DIR:-${HOME}/hererisk-data}:/data:ro
      - flood-index:/var/lib/hererisk-flood:ro
      - ${HERERISK_REPORT_DIR:-${HOME}/.hererisk-local/reports}:/reports

  flood-diag-build:   # Phase 4-D: offline preparation of the invalid flood polygons into their own volume
    <<: *hardening
    profiles: ["init"]
    network_mode: none
    restart: "no"
    mem_limit: 1g
    command: ["python", "-m", "hererisk.flood", "diag", "build", "--regions", "/data/regions.json",
              "--flood-index", "/var/lib/hererisk-flood/flood-index.sqlite",
              "--output", "/var/lib/hererisk-flood-diag/flood-diag.sqlite"]
    volumes:
      - ${HERERISK_DATA_DIR:-${HOME}/hererisk-data}:/data:ro
      - flood-index:/var/lib/hererisk-flood:ro
      - flood-diag:/var/lib/hererisk-flood-diag

  flood-diag:   # Phase 4-D: one-shot light search / comparison / benchmark (diagnosis only, reads no ZIP)
    <<: *hardening
    profiles: ["verify"]
    network_mode: none
    restart: "no"
    mem_limit: 256m
    environment:
      HERERISK_FLOOD_DIAG_INDEX: /var/lib/hererisk-flood-diag/flood-diag.sqlite
    entrypoint: ["python", "-m", "hererisk.flood", "diag"]
    command: ["point", "--flood-index", "/var/lib/hererisk-flood/flood-index.sqlite", "--point", "35.625065,139.573836"]
    volumes:
      - flood-index:/var/lib/hererisk-flood:ro
      - flood-diag:/var/lib/hererisk-flood-diag:ro
      - ${HERERISK_REPORT_DIR:-${HOME}/.hererisk-local/reports}:/reports

  flood-shadow-verify:   # Phase 4-E: one-shot Shadow checks on the Phase 4-C points (generated points only)
    <<: *hardening
    profiles: ["verify"]
    network_mode: none
    restart: "no"
    mem_limit: 2g
    entrypoint: ["python", "-m", "hererisk.flood", "shadow-verify", "--regions", "/data/regions.json",
                 "--flood-index", "/var/lib/hererisk-flood/flood-index.sqlite",
                 "--diag-index", "/var/lib/hererisk-flood-diag/flood-diag.sqlite", "--report-dir", "/reports"]
    command: ["--help"]
    volumes:
      - ${HERERISK_DATA_DIR:-${HOME}/hererisk-data}:/data:ro
      - flood-index:/var/lib/hererisk-flood:ro
      - flood-diag:/var/lib/hererisk-flood-diag:ro
      - ${HERERISK_REPORT_DIR:-${HOME}/.hererisk-local/reports}:/reports

  flood-diag-api-verify:   # Phase 4-G: one-shot diagnostic API checks on the Phase 4-C points (generated points only)
    <<: *hardening
    profiles: ["verify"]
    network_mode: none
    restart: "no"
    mem_limit: 2g
    entrypoint: ["python", "-m", "hererisk.flood", "diag-api-verify", "--regions", "/data/regions.json",
                 "--flood-index", "/var/lib/hererisk-flood/flood-index.sqlite",
                 "--diag-index", "/var/lib/hererisk-flood-diag/flood-diag.sqlite", "--report-dir", "/reports"]
    command: ["--help"]
    volumes:
      - ${HERERISK_DATA_DIR:-${HOME}/hererisk-data}:/data:ro
      - flood-index:/var/lib/hererisk-flood:ro
      - flood-diag:/var/lib/hererisk-flood-diag:ro
      - ${HERERISK_REPORT_DIR:-${HOME}/.hererisk-local/reports}:/reports

  tsunami-index:   # Phase 4-M: builds the tsunami search index from the registered A40 ZIPs (read only)
    <<: *hardening
    profiles: ["init"]
    network_mode: none
    restart: "no"
    mem_limit: 1g
    command: ["python", "-m", "hererisk.tsunami", "build", "--regions", "/data/${HERERISK_TSUNAMI_REGIONS:-regions-tsunami.json}",
              "--output", "/var/lib/hererisk-tsunami/tsunami-index.sqlite"]
    volumes:
      - ${HERERISK_DATA_DIR:-${HOME}/hererisk-data}:/data:ro
      - tsunami-index:/var/lib/hererisk-tsunami

  tsunami-verify:   # Phase 4-M: one-shot independent check of the tsunami index / provider against the GML
    <<: *hardening
    profiles: ["verify"]
    network_mode: none
    restart: "no"
    mem_limit: 1g
    command: ["python", "-m", "hererisk.tsunami", "verify", "--regions", "/data/${HERERISK_TSUNAMI_REGIONS:-regions-tsunami.json}",
              "--index", "/var/lib/hererisk-tsunami/tsunami-index.sqlite", "--report-dir", "/reports"]
    volumes:
      - ${HERERISK_DATA_DIR:-${HOME}/hererisk-data}:/data:ro
      - tsunami-index:/var/lib/hererisk-tsunami:ro
      - ${HERERISK_REPORT_DIR:-${HOME}/.hererisk-local/reports}:/reports

  location-api-tsunami:   # Phase 4-M local check only: the Location API with flood and tsunami (not the default)
    <<: *hardening
    profiles: ["tsunami"]
    restart: "no"
    mem_limit: 1g
    command: ["python", "-m", "hererisk.location.server", "--host", "0.0.0.0", "--port", "8001", "--container",
              "--address-regions", "/data/${HERERISK_TSUNAMI_REGIONS:-regions-tsunami.json}",
              "--elevation-api", "http://elevation-api:8000", "--elevation-token-file", "/run/secrets/api_token",
              "--elevation-fixture", "--flood-index", "/var/lib/hererisk-flood/flood-index.sqlite",
              "--tsunami-index", "/var/lib/hererisk-tsunami/tsunami-index.sqlite"]
    ports:
      - "127.0.0.1:8013:8001"
    volumes:
      - ${HERERISK_DATA_DIR:-${HOME}/hererisk-data}:/data:ro
      - flood-index:/var/lib/hererisk-flood:ro
      - tsunami-index:/var/lib/hererisk-tsunami:ro
    secrets:
      - api_token
    networks:
      - public
    depends_on:
      elevation-api:
        condition: service_healthy

  token:   # creates ${HERERISK_SECRET_DIR}/api-token (0600); refuses to overwrite
    <<: *hardening
    profiles: ["init"]
    network_mode: none
    restart: "no"
    command: ["python", "-m", "hererisk.cli", "api-token-generate", "--output", "/secrets/api-token"]
    volumes:
      - ${HERERISK_SECRET_DIR:-${HOME}/.hererisk-local/secrets}:/secrets

networks:
  public:
  admin:

volumes:
  elevation-data:
    name: hererisk-elevation-data
  flood-index:
    name: hererisk-flood-index
  flood-diag:
    name: hererisk-flood-diag
  tsunami-index:
    name: hererisk-tsunami-index

secrets:
  api_token:
    file: ${HERERISK_SECRET_DIR:-${HOME}/.hererisk-local/secrets}/api-token
