[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hererisk"
version = "0.0.0"
description = "HereRisk pipeline (Phase 1-A.1: fixture-only elevation download)"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5", "pypng==0.20220715.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hererisk-pipeline = "hererisk.cli:main"
hererisk-elevation-api = "hererisk.elevation.api.server:main"
hererisk-location-api = "hererisk.location.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra"
